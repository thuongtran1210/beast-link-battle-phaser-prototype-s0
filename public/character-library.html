<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beast Link Battle — Thư viện nhân vật</title>
<style>
  * { box-sizing:border-box } body { margin:0; background:#0b1228; color:#edf2ff; font:15px system-ui,sans-serif }
  main { max-width:1400px; margin:auto; padding:28px } h1 { margin:0 0 8px; font-size:28px }
  p { color:#acbad5; line-height:1.6 } a { color:#91d7ff } .controls { display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin:24px 0 }
  select,button { background:#1a2850; color:#edf2ff; border:1px solid #556c97; border-radius:8px; padding:9px; font:inherit; cursor:pointer }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px }
  article { background:#121d3b; border:1px solid #334c7d; border-radius:16px; padding:16px }
  .stage { height:270px; display:flex; align-items:flex-end; justify-content:center; border-radius:12px; background:#091126; padding:8px }
  .light .stage { background:#eeece6 } .stage img { width:var(--sprite-size,128px); height:var(--sprite-size,128px); object-fit:contain }
  .identity { display:flex; gap:12px; align-items:center; margin-top:14px } .identity img { width:56px; height:56px }
  h2 { font-size:16px; margin:0 0 4px } small { color:#a9b8d7 } .links { display:flex; gap:16px; margin-top:12px }
  .error { color:#ff9ea4 } img.failed { outline:2px solid #ff596c }
</style>
<main>
  <h1>Thư viện 27 nhân vật</h1>
  <p>6 Beast và 3 enemy đang dùng trong game. Các mẫu còn lại là asset dự phòng, chưa có gameplay riêng. <a href="/">Mở game</a></p>
  <div class="controls">
    <label>Hiển thị <select id="filter"><option value="all">Tất cả 27 mẫu</option><option value="active">Đang dùng trong game</option><option value="reserve">Asset dự phòng</option></select></label>
    <label>Kích thước <select id="size"><option value="128">128 px</option><option value="240">240 px</option></select></label>
    <button id="background" type="button">Đổi nền sáng / tối</button>
    <span id="count" aria-live="polite"></span>
  </div>
  <div id="grid"></div>
</main>
<script type="module">
const active = {
  'duck-guardian':'Snowguard', 'bear-hammer':'Ironclad', 'rabbit-archer':'Windstrider',
  'fox-archer':'Swiftwing', 'raccoon-swordsman':'Shadowclaw', 'badger-mage':'Starcaller',
  'penguin-knight':'Enemy Frontliner', 'crow-assassin':'Enemy Diver', 'deer-archer':'Enemy Ranged',
};
const grid = document.querySelector('#grid');
let entries = [];
function render() {
  const filter = document.querySelector('#filter').value;
  const visible = entries.filter(e => filter === 'all' || (filter === 'active' ? active[e.slug] : !active[e.slug]));
  grid.replaceChildren();
  for (const e of visible) {
    const card = document.createElement('article');
    const stage = document.createElement('div'); stage.className = 'stage';
    const body = document.createElement('img'); body.src=e.base; body.alt=e.slug; body.loading='lazy';
    body.addEventListener('error',()=>body.classList.add('failed')); stage.append(body);
    const identity=document.createElement('div'); identity.className='identity';
    const icon=document.createElement('img'); icon.src=e.icon; icon.alt='Portrait '+e.slug; icon.loading='lazy';
    const text=document.createElement('div'); const name=document.createElement('h2'); name.textContent=e.slug;
    const status=document.createElement('small'); status.textContent=active[e.slug] || 'Asset dự phòng';
    text.append(name,status); identity.append(icon,text);
    const links=document.createElement('div'); links.className='links';
    for (const [label,path] of [['Sprite PNG',e.base],['Icon PNG',e.icon]]) {
      const link=document.createElement('a'); link.textContent=label; link.href=path; link.target='_blank'; link.rel='noopener'; links.append(link);
    }
    card.append(stage,identity,links); grid.append(card);
  }
  document.querySelector('#count').textContent=visible.length+' nhân vật';
}
document.querySelector('#filter').addEventListener('change',render);
document.querySelector('#size').addEventListener('change',e=>document.documentElement.style.setProperty('--sprite-size',e.target.value+'px'));
document.querySelector('#background').addEventListener('click',()=>document.body.classList.toggle('light'));
try {
  const response=await fetch('/assets/characters/manifest.json');
  if (!response.ok) throw new Error('Không tải được danh sách nhân vật.');
  entries=await response.json(); render();
} catch(error) { grid.textContent=error.message; grid.classList.add('error'); }
</script>
</html>
